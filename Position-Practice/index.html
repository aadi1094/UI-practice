<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position Practice</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="card">
            <img src="images/image-1.png" alt="Snow-capped peaks and pine forest reflected in a still turquoise lake at sunrise">
            <div class="text">
                <h3>Mountain View</h3>
                <p>Shot in Iceland, 2024</p>
            </div>
        </div>


        <div class="card">
            <img src="images/image-2.png" alt="A laptop, notebook and potted plant on a wooden desk beside a window at dusk">
            <div class="text">
                <h3>Study Table</h3>
                <p>Used for studying and working</p>
            </div>
        </div>

        <div class="card">
            <img src="images/image-3.png" alt="A golden retriever puppy sitting in sunlit grass scattered with daisies">
            <div class="text">
                <h3>Dog</h3>
                <p>My best friend</p>
            </div>
        </div>

        <div class="card">
            <img src="images/image-4.png" alt="Waves washing onto a sandy beach as the sun sets over the ocean, framed by palm fronds">
            <div class="text">
                <h3>Beach View</h3>
                <p>Shot in Goa, 2024</p>
            </div>
        </div>

        <div class="card">
            <img src="images/image-5.png" alt="A person sitting beneath a tree on a hillside under the Milky Way, with a lit valley below">
            <div class="text">
                <h3>Starry Night</h3>
                <p>The Milky Way from a hilltop</p>
            </div>
        </div>

        <div class="card">
            <img src="images/image-6.png" alt="A cobbled lane between stone buildings draped in pink bougainvillea, leading down to a blue lake and mountains">
            <div class="text">
                <h3>Old Town Lane</h3>
                <p>Cobbled streets above the lake</p>
            </div>
        </div>

    </div>
</body>

</html>
